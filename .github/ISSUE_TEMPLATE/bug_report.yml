name: Bug report
description: Something is broken or looks wrong
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Six fields are required. Fill in the rest only if you know it. A short report is better than one you did not send.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched [existing issues](https://github.com/REFFIX-X/luci-theme-monokai/issues?q=is%3Aissue) and this is not a duplicate
          required: true
        - label: I am on the latest [release](https://github.com/REFFIX-X/luci-theme-monokai/releases), I hard-reloaded (Ctrl+Shift+R), and the bug is still there
          required: true
        - label: Extensions that restyle pages (Dark Reader, Stylus, and similar) are off, and the bug persists

  - type: dropdown
    id: release
    attributes:
      label: OpenWrt release
      description: It is in the LuCI footer on any page. This release targets OpenWrt 25.12/APK.
      options:
        - "25.12"
        - Snapshot
        - Other / not sure
    validations:
      required: true

  - type: input
    id: theme-version
    attributes:
      label: Theme version
      description: Shown on the Appearance page (/admin/system/footstrap).
      placeholder: "2.1.0"
    validations:
      required: true

  - type: input
    id: page-path
    attributes:
      label: Page path
      placeholder: "/cgi-bin/luci/admin/network/firewall/forwards"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What is wrong and how to reproduce it
      description: What you see, what you expected, and what to click to see the same thing.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: |
        Drag images into this field. A layout bug cannot be reproduced from prose alone. If you can, add the same shot on the stock luci-theme-bootstrap theme.
    validations:
      required: true

  - type: dropdown
    id: stock-theme
    attributes:
      label: Does it also happen on stock luci-theme-bootstrap?
      description: If yes, it is most likely a LuCI or package bug, not a theme bug.
      options:
        - No, this theme only
        - Yes, on the stock theme too
        - Not checked
    validations:
      required: true

  - type: dropdown
    id: appearance
    attributes:
      label: Layout, palette, mode
      description: These are on the Appearance page (/admin/system/footstrap). Select whatever the bug shows on.
      multiple: true
      options:
        - "Layout: sidebar"
        - "Layout: top"
        - "Palette: Footstrap"
        - "Palette: Hi-Contrast"
        - "Palette: Bootstrap"
        - "Palette: OpenWrt 2020"
        - "Palette: Forum"
        - "Mode: dark"
        - "Mode: light"

  - type: dropdown
    id: viewport
    attributes:
      label: Device and viewport
      multiple: true
      options:
        - Desktop (>1200px)
        - Laptop (992–1200px)
        - Tablet (768–992px)
        - Phone (<768px)

  - type: input
    id: package-link
    attributes:
      label: Third-party package link
      description: Only if the page comes from a third-party luci-app. Empty means a stock LuCI page.
      placeholder: "luci-app-podkop — https://github.com/itdoginfo/podkop"

  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: "Chrome 150 / Firefox 152 / Safari 18"

  - type: input
    id: luci-lang
    attributes:
      label: LuCI language
      description: Long labels, CJK, and RTL break layout differently than English.
      placeholder: "English"

  - type: textarea
    id: board
    attributes:
      label: Router and firmware
      description: If you have SSH access, the output of `ubus call system board`.
      render: json

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Console errors, the last theme version that worked, custom CSS, a reverse proxy, or an unusual zoom.
