name: Feature request
description: An idea, a design improvement, or support for a third-party package
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The theme styles generic LuCI widgets, not individual pages. The more precisely you name the widget or page, the more likely one fix covers other pages too.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight
      options:
        - label: I searched [existing issues](https://github.com/REFFIX-X/luci-theme-monokai/issues?q=is%3Aissue) and this request is not already there
          required: true

  - type: dropdown
    id: kind
    attributes:
      label: Kind of request
      options:
        - Improve the styling of an existing page
        - Support a third-party luci-app that looks broken
        - New palette or colour scheme
        - New theme feature
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: Describe the situation, not only the fix you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true

  - type: input
    id: page-path
    attributes:
      label: Page path
      description: Where it can be seen
      placeholder: "/cgi-bin/luci/admin/status/overview"

  - type: input
    id: package-link
    attributes:
      label: Third-party package link
      description: Required if this is about a third-party luci-app.
      placeholder: "luci-app-podkop — https://github.com/itdoginfo/podkop"

  - type: textarea
    id: mockups
    attributes:
      label: Screenshots, mockups, references
      description: How it looks now and how it should look.

  - type: textarea
    id: extra
    attributes:
      label: Anything else
